<!DOCTYPE html>
<html lang="pt-BR" class="{{ session.get('theme','dark') }}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — ServiceFlow Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .auth-logo-icon {
      width: 38px; height: 38px;
      background: var(--primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff;
    }
    .auth-logo-text {
      font-size: 18px; font-weight: 700; color: var(--text);
    }
    .auth-logo-text span { color: var(--primary); }
    .auth-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .auth-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }
    .form-control {
      width: 100%; padding: 10px 14px;
      background: var(--bg-hover); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-alpha); }
    .btn-primary {
      width: 100%; padding: 11px; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background .15s; font-family: 'Inter', sans-serif;
      margin-top: 4px;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .auth-footer { margin-top: 22px; text-align: center; font-size: 13px; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }
    .flash-list { margin-bottom: 18px; }
    .flash {
      padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px;
      margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
    }
    .flash.danger  { background: rgba(255,40,34,.12);  color: #ff2822; border: 1px solid rgba(255,40,34,.25); }
    .flash.warning { background: rgba(249,255,64,.12);  color: #f9ff40; border: 1px solid rgba(249,255,64,.25); }
    .flash.success { background: rgba(0,238,186,.12);  color: #00eeba; border: 1px solid rgba(0,238,186,.25); }
    .flash.info    { background: rgba(0,205,204,.12); color: #00cdcc; border: 1px solid rgba(0,205,204,.25); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">SF</div>
      <div class="auth-logo-text">Service<span>Flow</span> Pro</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="flash-list">
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    <div class="auth-title">Bem-vindo(a) de volta</div>
    <div class="auth-sub">Acesse o painel de gestão de serviços</div>

    <form method="post" action="{{ url_for('auth.login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <input type="email" id="email" name="email" class="form-control"
          placeholder="seu@email.com" value="{{ email }}" required autofocus/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <input type="password" id="password" name="password" class="form-control"
          placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <div class="auth-footer">
      Não tem conta? <a href="{{ url_for('auth.cadastro') }}">Criar conta</a>
    </div>
  </div>
</body>
</html>
